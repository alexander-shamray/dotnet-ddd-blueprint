# The baseline environment of §14.1, delivered in Appendix C's order:
# infrastructure at PR-06, each application block with the PR that builds
# its image. docs/backend-architecture/14-local-development.md is the
# specification; this file must stay reconciled with it.
name: commerce

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Local_Dev_Pa55w0rd!}"
      MSSQL_PID: Developer
    ports: [ "1433:1433" ]
    volumes: [ sql-data:/var/opt/mssql ]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Two Redis instances, because eviction policy cannot be shared — §8.1.
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  redis-coordination:
    image: redis:7-alpine
    # noeviction: locks, idempotency keys and the denylist must never be
    # evicted. Appendonly so a restart does not silently release held locks.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    ports: [ "6380:6379" ]
    volumes: [ redis-coordination-data:/data ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: [ "5672:5672", "15672:15672" ]
    volumes: [ rabbit-data:/var/lib/rabbitmq ]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: [ "8080:8080" ]
    volumes: [ ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro ]

  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  catalog-migrator:
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Catalog.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__CatalogMigrator: "${CATALOG_MIGRATOR_CONNECTION:-Server=sql;Database=Catalog;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  catalog-api:
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Catalog: "${CATALOG_CONNECTION:-Server=sql;Database=Catalog;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), read by AddMassTransitMessaging — which throws without
      # it, so this line is what lets the host start. A plain value, no ${…}
      # variable: guest/guest is RabbitMQ's documented local default (§14.1's
      # endpoint table), not a secret with a production shape, and
      # .env.example's contract covers variables, not constants.
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Catalog calls no peer synchronously, and outbound
      # identity belongs to the BFF alone (§9.7, §11.5).
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # Still no Redis keys: Catalog reads none yet, and they join when it
      # first consumes a cache. An env var nothing reads is the container form
      # of an unused registration — each joins with the PR whose code reads it,
      # which is what brought the line above with PR-16.
    ports: [ "5102:8080" ]
    depends_on:
      catalog-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # service_started, not service_healthy: the Keycloak image declares no
      # healthcheck, and `up --wait` on a dependency that can never report
      # healthy hangs until it times out. The host does not need the realm at
      # startup either — JwtBearer fetches the discovery document lazily, on
      # the first request that carries a token.
      keycloak: { condition: service_started }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes: [ ./otel/config.yaml:/etc/otel/config.yaml:ro ]
    ports: [ "4317:4317", "4318:4318" ]

  grafana:
    image: grafana/otel-lgtm:latest
    ports: [ "3000:3000" ]

volumes:
  sql-data:
  redis-coordination-data:
  rabbit-data:
