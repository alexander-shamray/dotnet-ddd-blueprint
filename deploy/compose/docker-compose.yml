# The baseline environment of §14.1, delivered in Appendix C's order:
# infrastructure at PR-06, each application block with the PR that builds
# its image. docs/backend-architecture/14-local-development.md is the
# specification; this file must stay reconciled with it.
name: commerce

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Local_Dev_Pa55w0rd!}"
      MSSQL_PID: Developer
    ports: [ "1433:1433" ]
    volumes: [ sql-data:/var/opt/mssql ]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Two Redis instances, because eviction policy cannot be shared — §8.1.
  redis-cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  redis-coordination:
    image: redis:7-alpine
    # noeviction: locks, idempotency keys and the denylist must never be
    # evicted. Appendonly so a restart does not silently release held locks.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    ports: [ "6380:6379" ]
    volumes: [ redis-coordination-data:/data ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Built rather than pulled, and the ONE infrastructure service that is
  # (§14.1). rabbitmq/Dockerfile adds the delayed message exchange plugin
  # §9.6's saga timeouts are scheduled through (ADR-021); the base image
  # is still an official tag, one line inside it.
  rabbitmq:
    build:
      context: rabbitmq
    ports: [ "5672:5672", "15672:15672" ]
    volumes: [ rabbit-data:/var/lib/rabbitmq ]
    healthcheck:
      # check_running answers "is the broker up", which was the whole question
      # while the image was stock. It is not any more: a broker missing the
      # plugin is running and healthy while every saga schedule hangs on a
      # declare it refuses (ADR-021), so the check asserts the plugin is
      # enabled as well. Both, not just the second — the plugin list is
      # readable from a broker that has not finished starting.
      #
      # is_enabled, NOT `list -e … | grep`. That was the first spelling and it
      # FAILED OPEN: `rabbitmq-plugins list` echoes the pattern in its own
      # banner — "Listing plugins with pattern "…"" — so grep matches whether
      # or not a plugin row follows. Measured against a stock broker: exit 0,
      # healthy, no plugin. A check written to catch the stock image passed on
      # the stock image. is_enabled reports it in its exit status instead —
      # measured 0 enabled, 69 not.
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running && rabbitmq-plugins is_enabled rabbitmq_delayed_message_exchange"]
      interval: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer, whichever host asks. Without this Keycloak derives the
      # issuer from each request's Host header, so a token minted through
      # localhost:8080 carries iss=http://localhost:8080/... while the
      # discovery document catalog-api reads over the compose network
      # advertises http://keycloak:8080/... — and ValidateIssuer rejects every
      # token the README tells a developer to obtain. The two names are the
      # same server; only the route differs.
      KC_HOSTNAME: http://localhost:8080
      # ...which leaves the container-side route to be restored: with a fixed
      # hostname Keycloak would otherwise advertise localhost:8080 for the
      # backchannel too, and catalog-api cannot reach that. Dynamic backchannel
      # resolves the endpoints from the request host while the issuer stays
      # frontend, which is exactly the split this needs.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Turns on /health/ready, on the management port, which is what the
      # healthcheck below reads. Off by default.
      KC_HEALTH_ENABLED: "true"
    ports: [ "8080:8080" ]
    volumes: [ ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro ]
    # The image has a shell — CMD-SHELL below needs one — but no HTTP client:
    # no curl, no wget. So the check is a bash TCP redirection against the
    # management port, which is the form Keycloak's own documentation gives for
    # exactly that reason. Without it `up --wait` returns as soon as the process
    # launches, and the README's token command can reach a realm that has not
    # finished importing: a 404 on the token endpoint, on a stack that has just
    # reported healthy.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  catalog-migrator:
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Catalog.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__CatalogMigrator: "${CATALOG_MIGRATOR_CONNECTION:-Server=sql;Database=Catalog;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  catalog-api:
    build:
      context: ../..
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Catalog: "${CATALOG_CONNECTION:-Server=sql;Database=Catalog;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), read by AddMassTransitMessaging — which throws without
      # it, so this line is what lets the host start. A plain value, no ${…}
      # variable: guest/guest is RabbitMQ's documented local default (§14.1's
      # endpoint table), not a secret with a production shape, and
      # .env.example's contract covers variables, not constants.
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Catalog calls no peer synchronously, and outbound
      # identity belongs to the BFF alone (§9.7, §11.5).
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # §8.1's two connections, and they joined on exactly the terms the
      # comment that used to stand here set: an env var nothing reads is the
      # container form of an unused registration, so each waits for the PR
      # whose code reads it. §8.5's IdempotencyBehavior is that PR — it claims
      # a {service}:idem: key on the coordination instance before any command
      # runs.
      #
      # BOTH are required even though only the second is read today.
      # AddRedisConnections is one call by design (§8.2), so a service either
      # has Redis or does not; it reads both eagerly and throws naming the
      # missing one, which is what makes an absent key a host that will not
      # start rather than a cache that silently reads the database.
      #
      # 6379 on both, and the ports differ only on the HOST side (6379/6380).
      # Inside the network each container listens on Redis's own port, so
      # naming 6380 here would reach nothing.
      ConnectionStrings__RedisCache: "redis-cache:6379"
      ConnectionStrings__RedisCoordination: "redis-coordination:6379"
    ports: [ "5102:8080" ]
    depends_on:
      catalog-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # service_healthy since the block above declares a healthcheck. The API
      # itself does not need it — JwtBearer fetches the discovery document
      # lazily, on the first request that carries a token — but `up --wait`
      # gates on every service's health, and the value is for whoever types the
      # README's token command the moment it returns. Under service_started
      # that command races the realm import and can be handed a 404.
      keycloak: { condition: service_healthy }
      # Both Redis instances, and the coordination one is load-bearing since
      # §8.5's behaviour claims a key before any command runs. Ordered after
      # keycloak only because this list reads top-down; compose treats every
      # entry alike.
      #
      # service_healthy, not service_started: AddRedisConnections sets
      # AbortOnConnectFail = false (§8.1's "degrade, don't die"), so the host
      # WOULD start against a Redis still booting — and the first protected
      # command would then fail on a claim rather than on anything a reader
      # could connect to a missing container.
      redis-cache: { condition: service_healthy }
      redis-coordination: { condition: service_healthy }

  # The single entry point for external clients (§10.1). No migrator beside it
  # and no pair rule: the gateway owns no database, so there is nothing to
  # migrate and nothing to gate a start on.
  gateway:
    build:
      context: ../..
      dockerfile: src/Gateway/Gateway.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # The authority, because the gateway validates JWTs like every other host
      # (§11.2). NOT Identity__Client__* — those are for calling other services
      # (§11.5), and the gateway calls nobody: YARP forwards the caller's token.
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      # Locally the gateway IS the edge: nothing forwards, RemoteIpAddress is
      # already the client, and trusting X-Forwarded-For would let any caller
      # pick its own rate-limit bucket. In Kubernetes this is true (§15.3), and
      # Ingress__TrustedNetworks__0…n becomes required with it.
      Ingress__Enabled: "false"
      # Browsers hit the gateway directly in dev. The SPA's dev origin is
      # 5173 (Vite's default): 3000 belongs to Grafana in this same file.
      # Required once enabled — the host refuses to start without it.
      Cors__Enabled: "true"
      Cors__Origins__0: "http://localhost:5173"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports: [ "5000:8080" ]
    depends_on:
      keycloak: { condition: service_healthy }
      # The destinations in §10.2's route file that exist today. The one
      # remaining route — inventory — 502s until its service lands, which is a
      # true statement about the platform rather than a defect in this file: a
      # route costs nothing at startup, where a Compose dependency on a service
      # Compose cannot see fails the whole `up`. So a destination joins this
      # list with the PR that builds it: ordering-api with PR-18, web-bff with
      # PR-19.
      catalog-api: { condition: service_started }
      ordering-api: { condition: service_started }
      web-bff: { condition: service_started }

  ordering-migrator:
    build:
      context: ../..
      dockerfile: src/Services/Ordering/Ordering.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__OrderingMigrator: "${ORDERING_MIGRATOR_CONNECTION:-Server=sql;Database=Ordering;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  ordering-api:
    build:
      context: ../..
      dockerfile: src/Services/Ordering/Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Ordering: "${ORDERING_CONNECTION:-Server=sql;Database=Ordering;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), read by AddMassTransitMessaging — which throws without
      # it, so this line is what lets the host start. A plain value, no ${…}
      # variable: guest/guest is RabbitMQ's documented local default (§14.1's
      # endpoint table), not a secret with a production shape, and
      # .env.example's contract covers variables, not constants.
      ConnectionStrings__RabbitMq: "amqp://guest:guest@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Ordering calls no peer synchronously, and outbound
      # identity belongs to the BFF alone (§9.7, §11.5).
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # §8.1's two connections — see the catalog-api block above for the whole
      # argument, which is the same one twice. §8.5's IdempotencyBehavior is
      # the code that finally reads a key here: PlaceOrderCommand claims one
      # on the coordination instance before the order exists.
      ConnectionStrings__RedisCache: "redis-cache:6379"
      ConnectionStrings__RedisCoordination: "redis-coordination:6379"
    ports: [ "5101:8080" ]
    depends_on:
      ordering-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # service_healthy since the block above declares a healthcheck. The API
      # itself does not need it — JwtBearer fetches the discovery document
      # lazily, on the first request that carries a token — but `up --wait`
      # gates on every service's health, and the value is for whoever types the
      # README's token command the moment it returns. Under service_started
      # that command races the realm import and can be handed a 404.
      keycloak: { condition: service_healthy }
      # Both Redis instances — see catalog-api above for why service_healthy
      # rather than service_started.
      redis-cache: { condition: service_healthy }
      redis-coordination: { condition: service_healthy }

  # The one host with client credentials, because it is the one host that calls
  # a peer synchronously (§9.7). Everything else here has the authority only.
  # Named web-bff, matching the Aspire resource (§14.2) and the YARP
  # destination (§10.2) — the gateway resolves the destination by hostname, so
  # the container name IS the routing configuration.
  #
  # No migrator beside it and no pair rule: the BFF owns no database, so there
  # is nothing to migrate — the same shape the gateway block above has.
  web-bff:
    build:
      context: ../..
      dockerfile: src/BFF/Web.Bff/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      # Required by ValidateOnStart (§15.4) — this host refuses to boot without
      # all three, which is the whole point of the [Required] attributes on
      # ServiceIdentityOptions. Local values only; production mounts a secret.
      #
      # The client id must exist in the realm, and RealmClientTests is what
      # says so: a name here that Keycloak has never heard of satisfies
      # ValidateOnStart, boots cleanly, and fails every pricing call at the
      # token endpoint.
      Identity__Client__ClientId: "web-bff"
      Identity__Client__ClientSecret: "${BFF_CLIENT_SECRET:-local-dev-secret}"
      # The scope that becomes the audience every service validates (§11.5).
      # Not the same claim as `aud`, and nothing but the realm's audience
      # mapper makes one imply the other.
      Identity__Client__Scope: "commerce-api"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # No connection strings of any kind, and therefore no readiness check
      # (§13.5): a host with a connection string has one and a host without
      # one does not. /health/ready answers immediately here, correctly — not
      # because the BFF depends on nothing, but because its one dependency is
      # §9.7's synchronous hop to Catalog and that deliberately does not gate
      # readiness: a BFF reporting unready whenever Catalog is down would take
      # itself out of rotation for a fault it exists to degrade around. The
      # host declares that at the call site rather than leaving an empty
      # readiness set to pass on its own:
      # MapCommonHealthEndpoints(ownsNoReadinessDependencies: true), which is
      # what stops "declared empty" and "was never wired up" reading
      # identically from out here.
    ports: [ "5200:8080" ]
    depends_on:
      # Keycloak, because this host mints its own token and would otherwise
      # discover that on the first request.
      keycloak: { condition: service_healthy }
      # And catalog-api, which the gateway's block above cannot say about its
      # own destinations for a different reason — it routes to services that do
      # not exist yet, where this one calls a service that does. The hop is
      # over 8081, catalog-api's HTTP/2 endpoint (§9.7): a cleartext port
      # cannot serve HTTP/1.1 and h2c at once, so Catalog declares two and this
      # is the second. It is not published to the host and no route reaches it.
      catalog-api: { condition: service_started }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes: [ ./otel/config.yaml:/etc/otel/config.yaml:ro ]
    ports: [ "4317:4317", "4318:4318" ]

  grafana:
    image: grafana/otel-lgtm:latest
    ports: [ "3000:3000" ]

volumes:
  sql-data:
  redis-coordination-data:
  rabbit-data:
