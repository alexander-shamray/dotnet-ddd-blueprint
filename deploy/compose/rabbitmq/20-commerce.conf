# Per-service broker identity (#44), and the base image's default undone.
#
# `20-` so it sorts AFTER the image's own `10-defaults.conf`, which is where
# the setting below is turned the other way. That file ships
# `loopback_users.guest = false` under the comment "allow access to the guest
# user from anywhere on the network" — measured on this image, not inferred:
# `rabbitmqctl environment` reported `{loopback_users,[]}` and both services
# connected as `guest` from 172.18.0.x, which is not loopback.
#
# So before this file the platform's broker had ONE principal, it was tagged
# `administrator`, and it was reachable from any container on the network. §9.4
# already called queue arrival "a weaker boundary than it reads as"; that is
# the measurement behind the sentence.

# Every user, every permission. Imported at boot from a file in the image, so
# the broker a developer runs has the same authorisation shape as the one the
# charts describe — not a broker with no authorisation at all.
#
# THIS ALSO REMOVES `guest`, and it does so by a mechanism worth naming rather
# than relying on: RabbitMQ seeds the default user only when it boots with an
# EMPTY database, and skips that seeding when definitions are imported instead.
# On a volume that already holds `guest` — anyone who ran this stack before
# this file landed — importing definitions adds the two service users and
# leaves `guest` exactly as it was. `docker compose down -v` is what makes the
# removal true, and deploy/compose/README.md says so where a reader will hit
# it.
load_definitions = /etc/rabbitmq/definitions.json

# Belt and braces for the case above, and the only line here that still does
# something once `guest` is gone. If a stale volume keeps that account alive,
# this at least puts it back behind the loopback restriction RabbitMQ ships by
# default, so it cannot be used from another container.
loopback_users.guest = true
