name: Observability

# The third `deploy/**` artefact CI exercises directly rather than deploying
# (§15.1), after the Compose file and the Helm tree. Like both of those it is a
# separate workflow rather than a job in ci.yml, because path filtering is
# per-workflow and this proves a tree most pull requests never touch.
#
# It reaches no Prometheus, no Grafana and no cluster. What it asserts is that
# §13.6's alerts and §13.9's runbooks agree in BOTH directions, and that every
# metric a loaded rule or a dashboard panel reads is one this platform actually
# publishes — §13.6's third leg, "an alert has three parts: a condition, a
# signal and a procedure". Whether a rules file is syntactically valid to
# Prometheus is a different question and is NOT covered here; `promtool` would
# be the tool, and adding it is a decision no chapter has taken.
#
# The filter reaches outside deploy/observability on purpose, and the list is
# NOT maintained here: check.py declares it as SOURCE_INPUTS beside the reads,
# and asserts that both of this workflow's triggers cover every entry. That is
# deploy/helm/smoke.sh's lesson applied at the first opportunity rather than
# after the list has drifted three times — a copy of a list drifts exactly as a
# copy of a number does.
#
#   - src/** because the gate reads every C# instrument declaration to decide
#     whether an alert's signal exists. A new metrics type changes that answer,
#     and the awaiting-signal file is meant to go red when it does;
#   - docs/runbooks/** because a deleted or renamed runbook is an alert with no
#     procedure behind it, and nothing else would catch it.
on:
  pull_request:
    paths:
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
      - 'docs/runbooks/**'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
      - 'docs/runbooks/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Stdlib Python over text files: no restore, no SDK, no containers. The
    # whole run is seconds, which is what makes filtering on src/** affordable.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # 3.12, like every other Python job in this repository. The floor is the
      # point: a newer interpreter accepts APIs 3.12 does not, so a suite that
      # is green locally on 3.14 can still be unrunnable here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Alerts, runbooks and signals agree
        run: python deploy/observability/check.py
