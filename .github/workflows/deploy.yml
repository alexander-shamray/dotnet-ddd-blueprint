name: Deploy

# §15.5's canary, and §15.1's production leg of the pipeline.
#
# THIS WORKFLOW HAS NEVER REACHED A CLUSTER, and that is stated here rather
# than discovered from a failed run. There is no dev, staging or production
# environment for this repository, no kubeconfig and no registry; PR-23 shipped
# charts that nothing installs and PR-24 alert rules that no Prometheus loads,
# and this is the third artefact of that kind. What is asserted about it is
# asserted by `deploy/canary/canary.py`, whose suite runs on every change to
# this tree, and by the `check` job below, which reads this file.
#
# `workflow_dispatch` ONLY, and the reason is `main` staying green. A canary on
# `push` would fail on every merge for want of a cluster, which trains everyone
# to ignore a red pipeline -- the exact failure §15.1 spends a paragraph on
# about gates nobody has defined. When an environment exists, the trigger to
# add is `workflow_run` on a green CI over `main`, plus §15.1's manual approval
# gate between staging and production; the steps below do not change.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: 'Which deployable to roll (a key in deploy/canary/canary.json)'
        required: true
        type: choice
        options: [catalog-api, ordering-api, gateway, web-bff]
      tag:
        description: 'Image tag to promote. §15.3 refuses an empty one rather than rolling :latest.'
        required: true
        type: string
  # The gate runs on its own inputs, so a change to the plan, the script or
  # this file is checked without a deploy. `canary.py` declares SOURCE_INPUTS
  # beside the reads and asserts BOTH lists below cover every entry -- the Helm
  # tree's lesson, adopted rather than re-learned.
  pull_request:
    paths:
      - 'deploy/canary/**'
      - '.github/workflows/deploy.yml'
      - 'deploy/helm/**'
      - 'deploy/observability/**'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'deploy/canary/**'
      - '.github/workflows/deploy.yml'
      - 'deploy/helm/**'
      - 'deploy/observability/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  # NOT cancel-in-progress. Cancelling a rollout mid-ladder leaves a canary
  # Deployment serving traffic with nothing left to promote or retire it, which
  # is the one state this whole file exists to avoid. A second run queues.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stdlib Python over text, so it needs no cluster, no restore and no SDK --
  # the licence gate's terms, which is why it can gate the deploy below.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the canary's arithmetic
        working-directory: deploy/canary
        run: python -m unittest

      - name: The rollout plan agrees with the charts and the alerts
        run: python deploy/canary/canary.py check

  rollout:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      NAMESPACE: commerce
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every step below is written against a cluster this repository does not
      # have. `kubectl` and `helm` are assumed on the runner and PROMETHEUS_URL
      # and the kubeconfig are assumed in the environment; none is configured,
      # so this job has never run. It is here because the decision it encodes
      # is the deliverable, and burying it in a runbook would make it prose.
      - name: The first rung has a price, and it is paid before anything rolls
        run: |
          set -euo pipefail
          NEEDED=$(python deploy/canary/canary.py required --step 0)
          echo "The first step needs $NEEDED stable replicas (ADR-022)."
          # §15.5's 5% is one pod in twenty, so a three-replica service cannot
          # express it: one canary already serves 25%. Scaling up is what makes
          # the requested weight the served weight, and it is deliberate rather
          # than implicit -- `canary.py plan` refuses instead of rounding.
          #
          # §15.3's autoscaling.maxReplicas is 20 on the three service charts,
          # exactly this 19 plus one canary — chosen independently, and worth
          # knowing. It is NOT platform-wide: the gateway's is 30, so there the
          # 19 is what the weight costs rather than all the chart allows.
          #
          # **THE HPA'S FLOOR MOVES FIRST, and a `kubectl scale` alone would
          # not have held.** These charts enable an autoscaler on the stable
          # track with `minReplicas: 3`, and _deployment.tpl says in its own
          # comment that `replicas` is a managed field — "the HPA writes it
          # back". So a scale to 19 decays toward 3 across the ten-minute
          # dwells, and `plan` is then computing 5% against a replica count
          # the cluster no longer has. On a busy service the HPA may already
          # be near 19 and the scale is a no-op, which hides the hole rather
          # than closing it.
          #
          # Raising the floor is what makes the number stick, and restoring it
          # is owed FROM THE MOMENT IT IS RAISED. The floor is recorded in
          # GITHUB_ENV before the patch, and the `if: always()` step at the end
          # of this job is what puts it back — see the argument there.
          FLOOR=$(kubectl get hpa "$WORKLOAD" -n "$NAMESPACE" \
            -o jsonpath='{.spec.minReplicas}' 2>/dev/null || echo "")
          echo "HPA_FLOOR=$FLOOR" >> "$GITHUB_ENV"
          if [ -n "$FLOOR" ]; then
            kubectl patch hpa "$WORKLOAD" -n "$NAMESPACE" \
              --type=merge -p "{\"spec\":{\"minReplicas\":$NEEDED}}"
          fi

          kubectl scale deployment "$WORKLOAD" --replicas="$NEEDED" -n "$NAMESPACE"
          kubectl rollout status deployment "$WORKLOAD" -n "$NAMESPACE"
        env:
          WORKLOAD: ${{ inputs.workload }}

      - name: Climb the ladder
        run: |
          set -euo pipefail

          STEPS=$(python deploy/canary/canary.py steps)
          STABLE=$(kubectl get deployment "$WORKLOAD" -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')

          # `deploy/helm/*/charts/` is gitignored, and every service chart
          # depends on `file://../common`. Without this, the install below is
          # `found in Chart.yaml, but missing in charts/ directory:
          # commerce-common` and the canary never reaches a pod. `smoke.sh`
          # re-resolves on every run and the README's first setup command is
          # this one; the workflow was the copy that did not.
          CHART_DIR="deploy/helm/$(python deploy/canary/canary.py chart --workload "$WORKLOAD")"
          helm dependency update "$CHART_DIR"

          for STEP in $(seq 0 $((STEPS - 1))); do
            # `plan` prints CANARY_* assignments rather than JSON so this stays
            # a shell script instead of five inline `python -c` invocations,
            # each of them a quoting bug in the one file nothing here can test.
            # It EXITS NON-ZERO when the requested weight is not expressible at
            # the current replica count, and `set -e` is what makes that a
            # stopped rollout rather than a stale plan reused.
            eval "$(python deploy/canary/canary.py plan \
              --workload "$WORKLOAD" --stable "$STABLE" --step "$STEP")"
            echo "step $STEP: $CANARY_CANARY_REPLICAS canary pod(s), ${CANARY_ACHIEVED}% served"

            # The canary is a SECOND release of the same chart, differing only
            # in `canary.enabled`, its replica count and the image tag. The
            # stable release is not touched anywhere in this loop, which is
            # what makes the rollback below cost the canary's own pods and
            # nothing else (ADR-022).
            #
            # **IT INHERITS THE STABLE RELEASE'S VALUES, and `--install` is
            # exactly why it has to.** A new release inherits nothing: without
            # `-f`, every environment value falls through to the chart's own
            # default, so the canary would come up against
            # `identity.example.com`, the default OTLP endpoint and the default
            # database — a pod that is not a canary of anything. The gateway is
            # the one where this fails LOUDLY rather than silently, because
            # `edge-config.yaml` refuses an empty `ingress.trustedNetworks`;
            # the other three would have installed and been wrong. Measured:
            # `helm template` with the flags below and no `-f` fails at
            # edge-config.yaml:194.
            #
            # autoscaling off on the canary because an HPA would move the
            # weight underneath the analysis: the served share is a replica
            # ratio, so a canary that scales itself is a canary whose blast
            # radius nobody chose.
            helm get values "$WORKLOAD" -n "$NAMESPACE" -o yaml > stable-values.yaml
            # `--timeout 20m` because §15.1's callout, deploy/helm/README.md
            # and docs/runbooks/migration-failure.md all state the same rule:
            # Helm blocks on a hook whatever `--wait` says, its default is five
            # minutes, and MigrationJobFailed needs sixteen — so 20m > 16m is
            # the constraint. ADR-022 makes the CANARY release the one that
            # runs §7.4's hook, which is precisely why this command is the one
            # that must not inherit the default.
            #
            # `--set autoscaling.enabled=false` is NOT belt and braces: see
            # _autoscaling.tpl. The values inherited from the stable release
            # have the HPA on, and `_deployment.tpl` omits `replicas` whenever
            # it is — so without this flag the canary Deployment carries no
            # replica count and the API server defaults it to one, making
            # every rung of the ladder a single pod.
            helm upgrade --install "$WORKLOAD-canary" "deploy/helm/$CANARY_CHART" \
              -n "$NAMESPACE" \
              -f stable-values.yaml \
              --set canary.enabled=true \
              --set replicaCount="$CANARY_CANARY_REPLICAS" \
              --set autoscaling.enabled=false \
              --set image.tag="$TAG" \
              --wait --timeout 20m

            if [ "$CANARY_FINAL" = "True" ]; then
              echo "The canary is the release; promoting the tag onto the stable release."
              # THE CHART ARGUMENT IS REQUIRED. `helm upgrade` is
              # `[RELEASE] [CHART]`, and `--reuse-values` reuses the values,
              # not the chart — without it this is
              # `Error: "helm upgrade" requires 2 arguments`, at cutover, with
              # the canary still serving. The ladder climbs fine and then
              # cannot finish, which is the worst place in this file to fail.
              helm upgrade "$WORKLOAD" "deploy/helm/$CANARY_CHART" \
                -n "$NAMESPACE" \
                --reuse-values --set image.tag="$TAG" \
                --wait --timeout 20m
              helm uninstall "$WORKLOAD-canary" -n "$NAMESPACE"
              break
            fi

            # The window equals the dwell: a rate over ten minutes, read at the
            # end of ten minutes, IS §15.5's "watch for ten minutes".
            sleep "$((CANARY_DWELL_MINUTES * 60))"
            python deploy/canary/read_prometheus.py \
              --service "$CANARY_SERVICE_NAME" \
              --window "${CANARY_DWELL_MINUTES}m" \
              --out readings.json

            if ! python deploy/canary/canary.py analyse --readings readings.json; then
              echo "::error::Rolling back at step $STEP."
              helm uninstall "$WORKLOAD-canary" -n "$NAMESPACE"
              exit 1
            fi
          done
        env:
          WORKLOAD: ${{ inputs.workload }}
          TAG: ${{ inputs.tag }}

      # ONE mechanism, at the end, for every path — and that is the third
      # attempt at this.
      #
      # Calling a restore at each of the two outcomes covered promote and
      # rollback and missed `set -e`. Moving it onto a `trap EXIT` covered
      # everything the climb step could do and missed the step BEFORE it: the
      # scale-up is where the floor is raised, and a `kubectl` that fails there
      # skips the climb step entirely, because Actions defaults every step to
      # `if: success()`. Each fix was correct about the case it named and
      # scoped to the wrong unit.
      #
      # `if: always()` is scoped to the JOB, which is the unit the floor is
      # actually raised for. It restores after a promote, after a rollback,
      # after a failure in either step, and after a cancellation — and it does
      # nothing at all when HPA_FLOOR is unset, which is the case where no
      # autoscaler existed to patch.
      #
      # A service left at minReplicas 19 is a rollout that silently resized
      # production and then reported a failure about something else.
      - name: Put the autoscaler's floor back
        if: always()
        run: |
          if [ -n "${HPA_FLOOR:-}" ]; then
            kubectl patch hpa "$WORKLOAD" -n "$NAMESPACE" \
              --type=merge -p "{\"spec\":{\"minReplicas\":$HPA_FLOOR}}" || true
          fi
        env:
          WORKLOAD: ${{ inputs.workload }}
