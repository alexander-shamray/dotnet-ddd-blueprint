name: Compose

# A separate workflow rather than a job in ci.yml because path filtering is
# per-workflow: the smoke pulls ~2 GB of images and proves a file most PRs
# never touch, so it runs only when that file (or this one) changes. The
# filter also contains §14.1's two :latest pins — a broken upstream latest
# can fail only a compose PR, never the main build.
#
# Since PR-10 the file carries application blocks with build: stanzas, so
# `up` also BUILDS those images — the smoke now compiles the solution inside
# Docker, which is what the timeout below is sized for. Note what the filter
# implies: a change under src/ alone does not re-run this workflow, so a
# Dockerfile broken by a source change surfaces on the next compose PR, not
# the offending one. Per-service image builds in CI proper are PR-25's
# deliverable (§15.1), not this smoke's.
on:
  pull_request:
    paths:
      - 'deploy/compose/**'
      - '.github/workflows/compose.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/compose/**'
      - '.github/workflows/compose.yml'

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 15 covered pulls alone; SIX .NET image builds ride on top — Catalog's
    # two, PR-17's gateway, PR-18's ordering pair and PR-19's BFF, each a
    # restore plus a publish with no layer cache on a fresh runner. The base
    # images are shared, the restores are not.
    #
    # 45, up from 40: PR-19 adds one image, so it is +5. 15 + 6 × 5 gives the
    # same 45 from the other direction, and the two arithmetics agreeing is
    # the check — PR-18's raise went out wrong precisely because only one of
    # them was performed.
    #
    # PR-21 makes it seven builds and does NOT raise this, which is the first
    # time that has been the right answer. The seventh is the broker's
    # (deploy/compose/rabbitmq), and it is not a .NET build at all: a pulled
    # base image, a 42 KB plugin download and one `rabbitmq-plugins enable`,
    # measured at ~1 s locally. Both arithmetics above count *restores*, so
    # multiplying by seven would be applying a per-build cost to a build that
    # does not carry it — the guard is the multiplication, not the count.
    #
    # It went out at 35 — the recount was performed against the *previous*
    # raise instead of against the number of images, which is the arithmetic
    # the comment above states and the count it names exists to force. So the
    # mechanism meant to catch a stale timeout produced a wrong one, and the
    # sentence describing that mechanism was itself the thing that read as
    # already-checked. A count in a comment is only a guard while somebody
    # multiplies by it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Syntax and interpolation first — seconds, no pulls, and a YAML error
      # should not cost an image download to find.
      - name: Validate the file
        run: docker compose -f deploy/compose/docker-compose.yml config -q

      # --wait exits non-zero if a healthcheck never passes, or a container
      # exits before the wait completes — the five healthchecks are asserted
      # directly, Keycloak's among them since PR-16, so realm readiness is part
      # of what `up --wait` proves rather than something the first token
      # request discovers. A service without one is only asserted to start.
      # One-shots are the carve-out, verified empirically
      # on PR-10: a service another gates on with
      # `service_completed_successfully` satisfies --wait by exiting 0, and
      # fails it by exiting non-zero — so the migrator's exit code is part of
      # what this smoke asserts.
      - name: Start and wait for healthy
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --quiet-pull

      - name: Show state on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml ps -a && docker compose -f deploy/compose/docker-compose.yml logs --tail 50

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
